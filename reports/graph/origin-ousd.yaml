edges:
  # === Governance flow: xOGN → Origin Gov → Timelock → Vault ===
  - from: xogn
    to: origin-gov
    kind: controls
    label: voting token
  - from: origin-gov
    to: timelock
    kind: proposes-on
    label: PROPOSER + EXECUTOR + CANCELLER
  - from: gov-multisig
    to: timelock
    kind: cancels-on
    label: CANCELLER only
  - from: timelock
    to: vault
    kind: controls
    label: governor (upgrade, approveStrategy, setTrusteeFeeBps, setOperatorAddr, ...)
  - from: timelock
    to: ousd-token
    kind: controls
    label: governor (governanceRebaseOptIn)

  # === Untimelocked Origin roles ===
  - from: strategist
    to: vault
    kind: holds-role
    label: "strategistAddr (deposit/withdraw strategy, AMO, vault params, pause)"
  - from: strategist
    to: ousd-token
    kind: holds-role
    label: "delegateYield / undelegateYield (any account)"
  - from: strategist
    to: amo-strategy
    kind: controls
    label: "operator (mintAndAdd / removeAndBurn / harvest)"
  - from: operator
    to: vault
    kind: holds-role
    label: "operatorAddr (rebase)"
  - from: operator
    to: cc-base
    kind: holds-role
    label: "operator (relay, sendBalanceUpdate)"
  - from: operator
    to: cc-hyperevm
    kind: holds-role
    label: "operator (sendBalanceUpdate)"

  # === Proxy implementations ===
