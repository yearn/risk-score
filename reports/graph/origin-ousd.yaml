slug: origin-ousd
title: Origin OUSD — Contract Dependency Graph
chain: ethereum

categories:
  - id: vault
    label: Vault / Token
  - id: strategy
    label: Strategy
  - id: governance
    label: Governance
  - id: infra
    label: Protocol Infra
  - id: dependency
    label: External Dependency

nodes:
  # === Vault / token layer ===
  - id: ousd-token
    label: OUSD Token (Proxy)
    address: "0x2A8e1E676Ec238d8A992307B495b45B3fEAa5e86"
    category: vault
    note: EIP-1967 rebasing ERC-20 (1e18 base units, 1:1 USDC). Supply ~6.44M OUSD against ~$6.45M of vault value — a 100.15% backing ratio.
  - id: ousd-impl
    label: OUSD Token Implementation
    address: "0xA7B7c59a1705e4a624ea8a4ad8a06f9de22dcc33"
    category: vault
  - id: wousd
    label: wOUSD (ERC-4626 Wrapper)
    address: "0xD2af830E8CBdFed6CC11Bab697bB25496ed6FA62"
    category: vault
    note: Appreciating wrapper for DeFi composability; holds ~1.81M OUSD, about 28% of total supply.
  - id: vault
    label: OUSD Vault (Proxy)
    address: "0xE75D77B1865Ae93c7eaa3040B038D7aA7BC02F70"
    category: vault
    note: Holds USDC only; four approved strategies (the HyperEVM leg holds dust); async withdrawal queue with a 600-second claim delay. The vault reads no oracle — its price-provider storage slot is deprecated, since a single 1:1 asset needs no pricing.
  - id: vault-impl
    label: OUSD Vault Implementation
    address: "0x82948060c4b72684bededec342350ab344975145"
    category: vault
    note: Upgraded 2026 (block 25106912) after the February 2026 Sigma Prime review of the vault upgrade and cross-chain strategies.
  - id: trustee
    label: FeeSplitter (trustee)
    address: "0xbbE561181D831e2a0fAd54C2c27F159a20B60464"
    category: vault
    note: Non-upgradeable fee splitter set as trusteeAddress in October 2026. Receives the 20% performance fee; operationsBps is 0, so everything goes to the harvester that buys OGN. Its split and recipients are set by the GOV multisig.

  # === Governance ===
  - id: xogn
    label: xOGN Governance Token
    address: "0x63898b3b6Ef3d39332082178656E9862bee45C57"
    category: governance
    note: Staked OGN — proposes via Origin DeFi Governance
  - id: origin-gov
    label: Origin DeFi Governance
    address: "0x1D3fBD4d129Ddd2372EA85c5Fa00b2682081c9EC"
    category: governance
    note: PROPOSER + EXECUTOR + CANCELLER on Timelock
  - id: timelock
    label: Timelock Controller (48h)
    address: "0x35918cDE7233F2dD33fA41ae3Cb6aE0e42E0e69F"
    category: governance
    note: Self-administered TIMELOCK_ADMIN_ROLE; getMinDelay() = 172,800 seconds.
  - id: gov-multisig
    label: GOV Multisig (5/8, cancel-only)
    address: "0xbe2AB3d3d8F6a32b96414ebbd865dBD276d3d899"
    category: governance
    note: CANCELLER on the mainnet Timelock and governor of the FeeSplitter. The same eight signers run the 5/8 Safe that drives the Base and HyperEVM Timelocks.
  - id: strategist
    label: 'Strategist Safe (2/8, "Origin: Guardian")'
    address: "0x4FF1b9D9ba8558F5EAfCec096318eA0d8b541971"
    category: governance
    note: 'Untimelocked — AMO ops, strategy allocation, vault params, remote-strategy deposits and withdrawals, and delegateYield over any account. Also guardian or sentinel on all six OUSD Morpho vaults, so it can veto pending curator actions.'
  - id: operator
    label: Operator (EOA)
    address: "0x739212d5bAfE6AAC8Be49a60B7d003bD41DBf38b"
    category: governance
    note: Calls rebase() on the vault, relays CCTP messages, and pushes cross-chain balance updates from both remote strategies. Bounded — rebase only ratchets supply upward, never above totalValue(), and is capped at roughly 7.87% APR.

  # === Protocol infra ===
  - id: cow-harvester
    label: CoW Harvester (reward swaps)
    address: "0xD400341aEfED0BC75176714cFdE82e8BDAA2D3b8"
    category: infra
    note: Sells CRV and MORPHO rewards into USDC and returns them to the vault.

  # === Active strategies (4) ===
  - id: morpho-strategy
    label: Morpho V2 Strategy (70.0%)
    address: "0x3643cafA6eF3dd7Fcc2ADaD1cabf708075AFFf6e"
    category: strategy
    note: The vault's defaultStrategy — deposits above the 25,000 USDC auto-allocate threshold land here.
  - id: amo-strategy
    label: Curve USDC AMO Strategy (13.5%)
    address: "0x26a02ec47ACC2A3442b757F45E0A82B8e993Ce11"
    category: strategy
    note: The only mint-whitelisted strategy. AMO operations must keep totalValue/totalSupply at or above 99.8% and must improve the pool's balance; maxSlippage is 0.2%.
  - id: cc-base
    label: Cross-Chain Master (Base, 16.6%)
    address: "0xB1d624fc40824683e2bFBEfd19eB208DbBE00866"
    category: strategy
    note: Reports a cached remoteStrategyBalance pushed over CCTP messaging and accepted up to one day old, rather than a live read.
  - id: cc-hyperevm
    label: Cross-Chain Master (HyperEVM, ~$28)
    address: "0xE0228DB13F8C4Eb00fD1e08e076b09eF5cD0EA1e"
    category: strategy
    note: Same cached-balance design as the Base leg. Wound down to about $28 between September 28 and October 1, 2026, but still an approved strategy the strategist can re-fund.

  # === Ethereum Morpho stack ===
  - id: morphousd-vault
    label: OUSD Vault V2 (Morpho V2)
    address: "0xFB154c729A16802c4ad1E8f7FF539a8b9f49c960"
    category: dependency
    link: "https://app.morpho.org/ethereum/vault/0xFB154c729A16802c4ad1E8f7FF539a8b9f49c960/"
    note: Symbol OUSD-V2, zero fees. The Morpho V2 strategy owns effectively all of its shares. Holds a single adapter that forwards 100% of assets into the MetaMorpho vault below.
  - id: morpho-v1-adapter
    label: Morpho Vault V1 Adapter
    address: "0xD8F093dCE8504F10Ac798A978eF9E0C230B2f5fF"
    category: infra
    note: Sole adapter of OUSD-V2. Adding another adapter and raising caps both carry a three-day timelock, and the adapter registry setting is abdicated.
  - id: ousd-v1
    label: OUSD Vault V1 (MetaMorpho)
    address: "0x5B8b9FA8e4145eE06025F642cAdB1B47e5F39F04"
    category: dependency
    morphoVault: v1
    link: "https://app.morpho.org/ethereum/vault/0x5B8b9FA8e4145eE06025F642cAdB1B47e5F39F04/"
    note: Symbol OUSD-V1. Three-day timelock, Origin Strategist Safe as guardian, 5% performance fee to the Yearn Security multisig. Effectively all of its ~$4.51M sits in the OETH/USDC market, where it is 45% of supply at 90% utilization.
  - id: security
    label: Yearn Security (4-of-7)
    address: "0xe5e2Baf96198c56380dDD5E992D7d1ADa0e989c0"
    category: governance
    note: Owner of both Ethereum OUSD Morpho vaults and curator of OUSD-V2. The same multisig curates Yearn's own Morpho vaults, so for a Yearn allocation this leg is an internal counterparty rather than an external one.
  - id: morpho-curator
    label: Morpho Curator Safe (2-of-3)
    address: "0x90D0f26025571295D18a6c041E47450B81886B51"
    category: governance
    note: Curator of OUSD-V1 and of the Base and HyperEVM vault pairs. Cap increases it submits wait three days and can be revoked by the owner or the Origin guardian.

  # === Base Morpho stack ===
  - id: cc-base-remote
    label: Remote Strategy (Base)
    address: "0xB1d624fc40824683e2bFBEfd19eB208DbBE00866"
    chain: base
    category: strategy
    note: Same address as the mainnet master. Deposits bridged USDC into the Base Morpho Vault V2 stack; strategist is the Origin Guardian Safe, operator is the same EOA as on mainnet. Its governor is the Base Timelock, so upgrades bypass the xOGN vote.
  - id: ousdb-v2
    label: OUSDb Vault V2 (Morpho V2)
    address: "0x2Ba14b2e1E7D2189D3550b708DFCA01f899f33c1"
    chain: base
    category: dependency
    link: "https://app.morpho.org/base/vault/0x2Ba14b2e1E7D2189D3550b708DFCA01f899f33c1/"
    note: Symbol OUSDb-V2, zero fees. Single adapter forwarding everything into OUSDb-V1; Origin Strategist Safe is a sentinel.
  - id: ousdb-v1
    label: OUSDb Vault V1 (MetaMorpho)
    address: "0x581Cc9a73Ec7431723A4a80699B8f801205841F1"
    chain: base
    category: dependency
    morphoVault: v1
    link: "https://app.morpho.org/base/vault/0x581Cc9a73Ec7431723A4a80699B8f801205841F1/"
    note: Symbol OUSDb-V1. Three-day timelock, Origin Strategist Safe as guardian, 5% performance fee. About 60% of its assets sit in the superOETHb market, where OUSD is 94% of supply and only about $79K is withdrawable on demand.
  - id: base-owner
    label: Base Vault Owner (4-of-7)
    address: "0xFEaE2F855250c36A77b8C68dB07C4dD9711fE36F"
    chain: base
    category: governance
    note: Owner of both Base OUSD Morpho vaults and fee recipient of OUSDb-V1; six of its seven signers are Yearn Security signers.

  # === HyperEVM Morpho stack ===
  - id: cc-hyper-remote
    label: Remote Strategy (HyperEVM)
    address: "0xE0228DB13F8C4Eb00fD1e08e076b09eF5cD0EA1e"
    chain: hyperevm
    category: strategy
    note: Same address as the mainnet master. Holds about $28. Its governor is the HyperEVM Timelock, which has a 60-second delay.
  - id: ousdh-v2
    label: OUSDh Vault V2 (Morpho V2)
    address: "0xE90959cbE7E56b5eBFF9AD12de611A4976F2d2B1"
    chain: hyperevm
    category: dependency
    note: Symbol OUSDh-V2. Owner is a 4/7 Safe with the Yearn Security signer set, curator is the 2/3 curator Safe, and the Origin Strategist Safe is a sentinel. setReceiveAssetsGate and setAdapterRegistry are permanently abdicated. Holds about $28.
  - id: ousdh-v1
    label: OUSDh Vault V1 (MetaMorpho)
    address: "0x0fb7e41A0A85Eb0BcA55172b73942cc6685e2B2E"
    chain: hyperevm
    category: dependency
    note: Symbol OUSDh-V1, MetaMorpho v1.1. Now matches the other chains — 4/7 owner, 2/3 curator, Origin Strategist Safe as guardian, three-day timelock. Holds dust in WHYPE and kHYPE markets.
  - id: hyper-owner
    label: HyperEVM Vault Owner (4-of-7)
    address: "0x518C21DC88D9780c0A1Be566433c571461A70149"
    chain: hyperevm
    category: governance
    note: Owner of both HyperEVM OUSD Morpho vaults; same seven signers as Yearn Security. Replaced the Yearn EOA that owned the vaults in August 2026.

  # === Remote-chain strategy governance ===
  - id: base-timelock
    label: Base Timelock (48h)
    address: "0xf817cb3092179083c48c014688D98B72fB61464f"
    chain: base
    category: governance
    note: governor() of the Base remote strategy; can upgrade it after a 48h delay. TIMELOCK_ADMIN_ROLE is held only by itself.
  - id: hyper-timelock
    label: HyperEVM Timelock (60s)
    address: "0x77121911A387c9e4Eae46345E0f831A6da8a1364"
    chain: hyperevm
    category: governance
    note: governor() of the HyperEVM remote strategy with getMinDelay() of 60 seconds. The deployer EOA retains CANCELLER only.
  - id: origin-remote-safe
    label: Origin Remote-Chain Safe (5/8)
    address: "0x92A19381444A001d62cE67BaFF066fA1111d7202"
    chain: base
    category: governance
    note: Same eight signers as the mainnet GOV multisig. PROPOSER, EXECUTOR, and CANCELLER on both the Base and HyperEVM Timelocks, so it can upgrade the remote strategies without an xOGN vote.

  # === Other external dependencies ===
  - id: curve-pool
    label: Curve OUSD/USDC Pool
    address: "0x6d18E1a7faeB1F0467A77C0d293872ab685426dc"
    category: dependency
    note: StableSwapNG holding roughly 571K OUSD and 304K USDC. The AMO owns 99.9% of the pool's LP supply, so this is OUSD's own capital rather than third-party depth.
  - id: curve-gauge
    label: Curve Gauge
    address: "0x1eF8B6Ea6434e722C916314caF8Bf16C81cAF2f9"
    category: dependency
    note: LP staking for CRV rewards.
  - id: cctp
    label: Circle CCTP V2
    category: dependency
    link: "https://www.circle.com/cross-chain-transfer-protocol"
    note: Carries both the USDC itself and the balance and withdrawal messages that the mainnet accounting for the Base leg (~17% of TVL) depends on.
  - id: usdc
    label: USDC (Circle)
    address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
    category: dependency
    note: The vault's only asset, held on Ethereum and Base (dust on HyperEVM). Circle can freeze or blacklist any holder.

