edges:
  # === Governance flow: xOGN → Origin Gov → Timelock → Vault ===
  - from: xogn
    to: origin-gov
    kind: controls
    label: voting token
  - from: origin-gov
    to: timelock
    kind: proposes-on
    label: PROPOSER + EXECUTOR + CANCELLER
  - from: gov-multisig
    to: timelock
    kind: cancels-on
    label: CANCELLER only
  - from: timelock
    to: vault
    kind: controls
    label: governor (upgrade, approveStrategy, setTrusteeFeeBps, setOperatorAddr, ...)
  - from: timelock
    to: ousd-token
    kind: controls
    label: governor (governanceRebaseOptIn)

  # === Untimelocked Origin roles ===
  - from: strategist
    to: vault
    kind: holds-role
    label: "strategistAddr (deposit/withdraw strategy, AMO, vault params, pause)"
  - from: strategist
    to: ousd-token
    kind: holds-role
    label: "delegateYield / undelegateYield (any account)"
  - from: strategist
    to: amo-strategy
    kind: controls
    label: "operator (mintAndAdd / removeAndBurn / harvest)"
  - from: operator
    to: vault
    kind: holds-role
    label: "operatorAddr (rebase)"
  - from: operator
    to: cc-base
    kind: holds-role
    label: "operator (sendBalanceUpdate)"
  - from: operator
    to: cc-hyperevm
    kind: holds-role
    label: "operator (sendBalanceUpdate)"

  # === Proxy implementations ===
  - from: ousd-impl
    to: ousd-token
    kind: manages
    label: EIP-1967 implementation
  - from: vault-impl
    to: vault
    kind: manages
    label: EIP-1967 implementation

  # === Internal vault wiring ===
  - from: vault
    to: trustee
    kind: routes-fees-to
    label: 20% performance fee
  - from: usdc
    to: vault
    kind: deposits-into
    label: sole collateral asset

  # === Mint authority: AMO is the only mint-whitelisted strategy ===
  - from: amo-strategy
    to: ousd-token
    kind: mints
    label: "mintForStrategy whitelisted; 99.8% solvency check"

  # === wOUSD wrapper ===
  - from: wousd
    to: ousd-token
    kind: deposits-into
    label: ERC-4626 wrap

  # === Allocation fan: vault → strategies ===
  - from: vault
    to: morpho-strategy
    kind: allocates-to
    label: "47.6%"
  - from: vault
    to: amo-strategy
    kind: allocates-to
    label: "16.3%"
  - from: vault
    to: cc-base
    kind: allocates-to
    label: "19.4%"
  - from: vault
    to: cc-hyperevm
    kind: allocates-to
    label: "16.7%"

  # === Ethereum Morpho stack ===
  - from: morpho-strategy
    to: morphousd-vault
