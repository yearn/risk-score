edges:
  # === Governance: multisig → timelock ===
  - from: gauntlet-multisig
    to: timelock-vault
    kind: proposes-on
    label: PROPOSER_ROLE + EXECUTOR_ROLE

  # === Governance: timelocks control their owned contracts ===
  - from: timelock-vault
    to: gtusda-vault
    kind: controls
    label: owner
  - from: timelock-vault
    to: provisioner
    kind: controls
    label: owner
  - from: timelock-vault
    to: roles-authority-vault
    kind: controls
    label: owner
  - from: timelock-vault
    to: forwarder-accountant
    kind: controls
    label: owner
  - from: timelock-feecalc
    to: price-fee-calculator
    kind: controls
    label: owner
  - from: timelock-feecalc
    to: roles-authority-feecalc
    kind: controls
    label: owner

  # === Mint authority ===
  - from: provisioner
    to: gtusda-vault
    kind: mints
    label: onlyProvisioner

  # === PPS authority: keeper → Forwarder → guard / PriceAndFeeCalculator ===
  - from: keeper-eoa
    to: forwarder-accountant
    kind: routes-through
    label: submit PPS
  - from: forwarder-accountant
    to: min-update-guard
    kind: routes-through
    label: pre-check interval
  - from: forwarder-accountant
    to: price-fee-calculator
    kind: holds-role
    label: vaultAccountant / setUnitPrice
  - from: price-fee-calculator
    to: gtusda-vault
    kind: manages
    label: unit price

  # === Capital flow: vault → bridge → Morpho ===
  - from: gtusda-vault
    to: cross-chain-bridge
    kind: routes-through
  - from: cross-chain-bridge
    to: morpho
    kind: deposits-into
    label: USDC
  - from: gtusda-vault
    to: gauntlet-frontier
    kind: deposits-into
    label: "USDC (same-chain Frontier)"

  # === MetaMorpho vault governance ===
  - from: gauntlet-vault-owner
    to: gauntlet-frontier
    kind: holds-role
    label: "owner"
  - from: gauntlet-vault-curator
    to: gauntlet-frontier
    kind: holds-role
    label: "curator"

  # === Fee flow ===
  - from: gtusda-vault
    to: gauntlet-multisig
    kind: routes-fees-to
    label: feeRecipient

