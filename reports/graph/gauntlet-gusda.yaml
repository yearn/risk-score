    note: Upgradeable TransparentUpgradeableProxy that issues the AA_FalconXUSDC senior tranche used as collateral behind ~94.8% of the Ethereum vault's assets. It both supplies the collateral price (virtualPrice, passed through a TranchesChainlinkOracle with no staleness metadata) and gates redemption behind a ~28.5-day epoch.
  - id: falconx
    label: FalconX (credit borrower)
    category: dependency
    note: Offchain credit counterparty of the Pareto FalconX USDC vault. The senior tranche gtUSDa holds is an unsecured claim on FalconX repayment, subordinated only by the vault's BB junior tranche.
