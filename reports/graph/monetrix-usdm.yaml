slug: monetrix-usdm
title: Monetrix USDM Dependencies
chain: hyperevm

categories:
  - id: vault
    label: Tokens
  - id: infra
    label: Protocol contracts
  - id: governance
    label: Governance
  - id: strategy
    label: Backing
  - id: dependency
    label: External dependencies

nodes:
  - id: usdm
    label: Monetrix USDM
    category: vault
    address: '0xE2d2959f89B6389DeB624bF076Fe7D9E5401f377'
  - id: susdm
    label: Staked USDM
    category: vault
    address: '0x5f1ab62C3159eBE04aFF14Beef84b0b60de63DDF'
    note: Held 2.568M USDM at the snapshot and receives the staker share of realized yield.
  - id: vault
    label: MonetrixVault
    category: infra
    address: '0x5586c2c8223C73Ec0B41D6352748e6c173372E11'
    note: Accepts USDC, issues USDM, routes backing and processes redemptions.
  - id: accountant
    label: MonetrixAccountant
    category: infra
    address: '0x8950A5136f3994f82b998e37e1183b8A37c12705'
    note: Values EVM and HyperCore backing through registered positions and precompiles. An operator can remove a registered entry and omit a liability from marked backing.
  - id: redeem
    label: RedeemEscrow
    category: infra
    address: '0xa118B1DBEb940944D071DBeC787A2D2e8D3B6578'
    note: Holds USDC for regular redemptions with a 48-hour cooldown.
  - id: instant
    label: InstantRedeem
    category: infra
    address: '0xaa556b9755C249F9B6b98F89dd20C5D4997B8F32'
    note: Separate USDC buffer for atomic exits, with a 30 bp fee at the snapshot.
  - id: instant-unstake
    label: InstantUnstake
    category: infra
    address: '0xaaCE6A69C27dF3F92763F688606335cBf3CE329d'
    note: Separate buffer for atomic sUSDM exits.
  - id: susdm-escrow
    label: sUSDMEscrow
    category: infra
    address: '0xD81600838Ab778D49038Df9c3B78CDcA244E3707'
    note: Holds USDM during the sUSDM unstake cooldown.
  - id: yield
    label: YieldEscrow
    category: infra
    address: '0x12E4F1a26dc008e68C0E77A60881680eDa91c58C'
  - id: insurance
    label: InsuranceFund
    category: infra
    address: '0x4D9f48F3055FA354254B1CA82a0badb88f7c2106'
    note: Separate reserve excluded from the Accountant's backing.
  - id: config
    label: MonetrixConfig
    category: infra
    address: '0x01313E95c0dD7FD4AD67Edc39823B079f6734Cee'
  - id: acl
    label: MonetrixAccessController
    category: governance
    address: '0x301024E319191495146AB3627fe3Fc1FfE586595'
  - id: safe
    label: Foundation Safe (2-of-3)
    category: governance
    address: '0x73a964d19E409E390628AFb1b5B42dde130F45EE'
    note: Holds GUARDIAN (instant pauses and operator list, accepted risk). Proposes and executes on both timelocks. Gave DEFAULT_ADMIN_ROLE to the 48h timelock and revoked its own DEFAULT_ADMIN_ROLE and GOVERNOR on November 24, 2026.
  - id: timelock24
    label: Governor Timelock (24h)
    category: governance
    address: '0x6f00b0Fbc805a8319b4837BB152F4FE700A329BF'
  - id: timelock48
    label: Upgrader Timelock (48h)
    category: governance
    address: '0xDe54E1F99752062ef448Dcc6C7636f90214C789e'
  - id: operators
    label: Vault Operators (4 EOAs)
    category: governance
    note: Each EOA can trade from the Vault's Core account on approved pairs (accepted trading risk). HyperCore checks individual orders and Monetrix sets no cumulative loss cap. Operators also edit the Accountant's supplied-asset registries.
  - id: core-signers
    label: Core Custody Multisig (2-of-3)
    category: governance
    note: Two signers can transfer available custody backing under HyperCore margin rules without a Monetrix timelock. One signer overlaps with the Foundation Safe.
  - id: core-agent
    label: Core API Agent (single key)
    category: governance
    link: 'https://app.hyperliquid.xyz/explorer/address/0x564Bfb706F0eFdaCF7AaFf44a1a780a9ABB66fAc'
    note: Single-key API wallet that trades the custody account (accepted trading risk). No Monetrix cumulative loss cap. Trades can add portfolio-margin borrowing; withdrawals and external transfers need the account's user signature. Valid until January 6, 2027.
  - id: deposit-wallet
    label: Circle CoreDepositWallet
    category: dependency
    address: '0x6B9E773128f453f5c2C60935Ee2DE2CBc5390A24'
  - id: usdc
    label: Native USDC
    category: dependency
    address: '0xb88339CB7199b77E23DB6E890353E22632Ba630f'
  - id: custody-core
    label: Core Custody Account
    category: strategy
    link: 'https://app.hyperliquid.xyz/explorer/address/0x6E25e5D971BDa9799F7A5242f4720b5B3f939200'
    note: Main USDM backing account (about 86% on November 25) with a HYPE hedge and a smaller BTC leg. Its USDC loan was repaid by November 25; funds are being moved to the Vault's own account.
  - id: vault-core
    label: Vault Core Account
    category: strategy
    link: 'https://app.hyperliquid.xyz/explorer/address/0x5586c2c8223C73Ec0B41D6352748e6c173372E11'
    note: The Vault contract's own Core account, the migration target. Held 286.6K USDC on November 25. Funds leave only back to the Vault or through timelocked governor actions.
  - id: hypercore
    label: HyperCore Markets and Margin
    category: dependency
    link: 'https://hyperliquid.gitbook.io/hyperliquid-docs/trading/portfolio-margin'
    note: Shared trading, portfolio margin, balance reads and asset transport dependency.

