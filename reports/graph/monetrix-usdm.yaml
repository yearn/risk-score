  - id: timelock24
    label: Governor Timelock (24h)
    category: governance
    address: '0x6f00b0Fbc805a8319b4837BB152F4FE700A329BF'
  - id: timelock48
    label: Upgrader Timelock (48h)
    category: governance
    address: '0xDe54E1F99752062ef448Dcc6C7636f90214C789e'
  - id: operators
    label: Vault Operators (4 EOAs)
    category: governance
    note: Each EOA can act individually. Hedge calls take caller-set limit prices with no oracle bound or cumulative loss cap.
  - id: core-signers
    label: Core Custody Multisig (2-of-3)
    category: governance
    note: Native HyperCore multisig signers for the custody account; one signer overlaps with the Foundation Safe.
  - id: core-agent
    label: Core Trading Agent
    category: governance
    note: API wallet delegated by the custody account. Permitted actions and limits are unverified.
  - id: deposit-wallet
    label: Circle CoreDepositWallet
    category: dependency
    address: '0x6B9E773128f453f5c2C60935Ee2DE2CBc5390A24'
  - id: usdc
    label: Circle USDC
    category: dependency
    address: '0xb88339CB7199b77E23DB6E890353E22632Ba630f'
  - id: core
    label: HyperCore Portfolio
    category: strategy
    link: 'https://app.hyperliquid.xyz/explorer/address/0x6E25e5D971BDa9799F7A5242f4720b5B3f939200'
    note: Encompasses the native 2-of-3 custody account and the Vault's own Core account. Predominantly HYPE basis exposure with a small BTC basis leg and USDC borrow/lend.
  - id: hypercore
    label: HyperCore Markets and Margin
    category: dependency
    link: 'https://hyperliquid.gitbook.io/hyperliquid-docs/trading/portfolio-margin'
    note: Shared trading, portfolio margin, balance reads and asset transport dependency.

