  - id: config
    label: MonetrixConfig
    category: infra
    address: '0x01313E95c0dD7FD4AD67Edc39823B079f6734Cee'
  - id: acl
    label: MonetrixAccessController
    category: governance
    address: '0x301024E319191495146AB3627fe3Fc1FfE586595'
  - id: safe
    label: Foundation Safe (2-of-3)
    category: governance
    address: '0x73a964d19E409E390628AFb1b5B42dde130F45EE'
