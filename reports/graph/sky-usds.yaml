  - id: allocator-grove
    label: Grove Prime (ALLOCATOR-BLOOM-A)
    category: infra
    note: "~$1.30B drawn at November 24, 2026 (plus ~$130M on ALLOCATOR-GROVE-A). Offchain-credit allocator: Galaxy Warehouse and Arch CLO, Janus Henderson Anemoy / Securitize AAA CLO funds, Apollo credit, and Grove x Steakhouse Morpho vault."
