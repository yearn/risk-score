  - id: dep-onchain-lending
    label: SparkLend / Morpho / Uniswap
    category: dependency
    note: "Onchain crypto lending is ~30.6% of backing (~$1.94B incl. Sky CDPs) at November 24, 2026: SparkLend USDS/USDT/DAI/USDC/PYUSD/RLUSD markets, Steakhouse-, Sentora- and Spark-curated Morpho vaults, Uniswap V4 stablecoin pools. Onchain-verifiable but carries smart-contract and market risk."
