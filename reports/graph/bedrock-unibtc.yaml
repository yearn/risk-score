  - { from: ccip-peer, to: uniBTC, kind: mints, label: "MINTER_ROLE (legacy CCIP messaging path)" }
  - { from: free-tunnel, to: uniBTC, kind: mints, label: "MINTER_ROLE (bridge mint, undocumented)" }
  - { from: free-tunnel-hub, to: free-tunnel, kind: manages, label: implementation source for upgradeTunnel }

  # === Capital flow ===
  - { from: uniBTC, to: uniBTC-vault, kind: routes-through, label: mint/redeem }
  - { from: uniBTC-vault, to: btc-custody-restaking, kind: allocates-to, label: BTC backing }
