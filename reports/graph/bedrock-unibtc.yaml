edges:
  # === Governance and upgrade control ===
  - { from: uniBTC-safe, to: uniBTC-proxyadmin, kind: controls, label: owner() }
  - { from: uniBTC-proxyadmin, to: uniBTC, kind: manages, label: token upgrade authority }
  - { from: uniBTC-proxyadmin, to: uniBTC-vault, kind: manages, label: vault upgrade authority }
  - { from: uniBTC-safe, to: uniBTC-vault, kind: holds-role, label: DEFAULT_ADMIN_ROLE }
  - { from: uniBTC-safe, to: uniBTC, kind: holds-role, label: "DEFAULT_ADMIN_ROLE + FREEZER_ROLE (grant minters / freeze users, no timelock)" }
