  - { from: uniBTC-proxyadmin, to: ccip-peer, kind: manages, label: peer upgrade authority }

  # === Mint / receipt issuance ===
  - { from: uniBTC-vault, to: uniBTC, kind: mints, label: "MINTER_ROLE (PoR-gated mint(); ungated execute())" }
