    category: vault
    note: EIP-1967 transparent proxy; BTC LRT; 8 decimals; Ethereum supply 2981.12556288 (2026-09-15)

  # === Protocol infra ===
  - id: uniBTC-vault
    label: uniBTC Vault
    address: "0x047D41F2544B7F63A8e991aF2068a363d210d6Da"
    category: infra
    note: Mint/redeem vault; mint() is PoR-gated but OPERATOR_ROLE execute() can call uniBTC.mint without the gate; same proxy address as Sept 2024 exploit
  - id: uniBTC-proxyadmin
    label: uniBTC ProxyAdmin
    address: "0x029E4FbDAa31DE075dD74B2238222A08233978f6"
