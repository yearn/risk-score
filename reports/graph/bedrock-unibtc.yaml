  - { from: ccip-token-pool, to: dep-chainlink, kind: routes-through, label: CCIP lanes (14) }

  # === Downstream use ===
  - { from: uniBTC, to: dep-brbtc, kind: routes-through, label: accepted by brBTC }

  # === Delegated reporting and withdrawal controls ===
  - { from: operational-eoa, to: uniBTC-vault, kind: holds-role, label: "MANAGER_ROLE + PAUSER_ROLE; feeders and adequacy" }
  - { from: operational-eoa, to: supply-feeder, kind: holds-role, label: "DEFAULT_ADMIN_ROLE + OPERATOR_ROLE; manual supply input" }
  - { from: supply-updater, to: supply-feeder, kind: holds-role, label: OPERATOR_ROLE }
  - { from: supply-proxy-admin, to: supply-feeder, kind: controls, label: EIP-1967 proxy admin }
  - { from: operational-eoa, to: ccip-token-pool, kind: controls, label: getRateLimitAdmin() }
  - { from: bedrock-admin-safe, to: ccip-peer, kind: holds-role, label: DEFAULT_ADMIN_ROLE }
