  - id: ccip-token-pool
    label: CCIP BurnMintTokenPool
    address: "0x1689C22eD5435e49071CFc208D1Ac6F2A2274490"
    category: infra
    note: Registered uniBTC pool in CCIP TokenAdminRegistry; holds MINTER_ROLE; owner is Bedrock admin Safe; inbound/outbound limits on 14 lanes; eight 2-BTC buckets, one 0.5-BTC bucket (BOB), five 2-satoshi buckets; 71 inbound mints / 3.00640757 uniBTC in 30 days to 2026-09-15; delegated EOA can reconfigure
  - id: ccip-peer
    label: Bedrock CCIPPeer
    address: "0x55a67cf07b8a9A09FB6D565279287cfE4Ab60eDc"
    category: infra
    note: Bedrock-custom CCIP messaging contract; holds MINTER_ROLE; source/destination allowlist BNB Chain and BOB; no messages or mints in 30 days to 2026-09-15; upgradeable proxy under the uniBTC ProxyAdmin
  - id: chainlink-por
    label: Chainlink uniBTC PoR
    address: "0xc590D9fb8eE78a0909dFF341ccf717000b7b7fF2"
    category: infra
    note: PoR feed wired into uniBTC Vault; 24h heartbeat; self-declared address set; 4640.515623 BTC (2026-09-15)
  - id: supply-feeder
    label: uniBTC Supply Feeder
    address: "0xE542919E4b281f10b437F947c8Ba224DdfaBc716"
    category: infra
    note: Operator-written totalTokenSupply 3845.74449304 vs dashboard 4546.67793 (2026-09-15); daily updates; eight one-day ~650-700 uniBTC dips since Apr 2026, current dip persisted through Sep 13 and Sep 14 updates; freshness not enforced by Vault

  # === Governance ===
  - id: uniBTC-safe
    label: uniBTC Ops Safe (3/5)
    address: "0xC9dA980fFABbE2bbe15d4734FDae5761B86b5Fc3"
    category: governance
    note: Owns uniBTC ProxyAdmin; DEFAULT_ADMIN_ROLE on Vault and token; FREEZER_ROLE on token; no guard/module; no transactions in 30 days (verified 2026-09-15)
  - id: bedrock-admin-safe
    label: Bedrock Admin Safe (3/5)
    address: "0xAeE017052DF6Ac002647229D58B786E380B9721A"
    category: governance
    note: Owns the uniBTC CCIP BurnMintTokenPool, BurnProxy and TransferProxy; token administrator in CCIP TokenAdminRegistry; directBTC admin

  # === Custody / strategy layer ===
  - id: btc-custody-restaking
    label: BTC Custody / Restaking
    category: strategy
    note: Wrapped/native BTC backing; custodian/signers not publicly named; DeFiLlama uniBTC TVL $357.92M on 2026-09-15; dashboard native BTC 78.62%, M-BTC 21.36%

  # === Accepted input assets ===
  - id: dep-wbtc
