  - { from: dep-merlin-bridge, to: dep-merlin-chain, kind: routes-through, label: relayers / chain liveness / data availability }

  # === Oracle / bridge wiring ===
  - { from: uniBTC-vault, to: chainlink-por, kind: routes-through, label: reserve check }
  - { from: uniBTC-vault, to: supply-feeder, kind: routes-through, label: supply check }
