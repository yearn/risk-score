  - { from: operational-eoa, to: fbtc-proxy, kind: holds-role, label: "DEFAULT_ADMIN_ROLE + OPERATOR_ROLE" }
  - { from: fbtc-proxy, to: uniBTC-vault, kind: holds-role, label: "OPERATOR_ROLE; LockedFBTC operations" }

  # === Single-EOA mint escalation (fork-verified 2026-09-15) ===
  - { from: legacy-router-admin, to: legacy-router, kind: controls, label: "EIP-1967 proxy admin (upgradeTo, no timelock)" }
  - { from: legacy-router, to: uniBTC-vault, kind: holds-role, label: "OPERATOR_ROLE; execute() on allowed targets incl. uniBTC" }
