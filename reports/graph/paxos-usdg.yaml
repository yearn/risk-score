slug: paxos-usdg
title: Paxos (USDG) — Contract Dependency Graph
chain: ethereum

categories:
  - id: vault
    label: Token
  - id: governance
    label: Governance
  - id: infra
    label: Protocol Infra
  - id: dependency
    label: External Dependency

nodes:
  # === Token layer ===
  - id: usdg
    label: USDG (Global Dollar)
    address: "0xe343167631d89B6Ffc58B88d6b7fB0228795491D"
    category: vault
    note: ERC1967 / UUPS Proxy

  # === Internal infra ===
  - id: supply-control
    label: SupplyControl
    address: "0x9a7164112029b81c07636AB7b59fA813E0883BBF"
    category: infra
    note: UUPS Proxy; rate-limited mint controller registry
  - id: sc1
    label: Supply Controller 1 (500M/hr cap)
    address: "0xf845a0A05Cbd91Ac15C3E59D126DE5dFbC2aAbb7"
    category: infra
    note: >-
      EOA; 500M cap refilling over 1h. allowAnyMintAndBurnAddress = false —
      can only mint to the issuance treasury 0x264b…97B5 and can only burn
      its own balance.
  - id: sc2
    label: Supply Controller 2 (1B burst, self-whitelisted)
    address: "0x2fb074FA59c9294c71246825C1c9A0c7782d41a4"
    category: infra
    note: >-
      EOA; 1B capacity refilling over 1h. allowAnyMintAndBurnAddress = false,
      but its only whitelisted destination is itself — the single key can
      mint 1B immediately (~25B per 24h) and transfer it anywhere (simulated
      at block 26,221,465). Key custody model unknown.
  - id: oft-wrapper
    label: OFTWrapper (LayerZero V2)
    address: "0x147BdE4F997f0d4C7544ED0C55eAcf1E5E6bf9c4"
    category: infra
    note: >-
      SC3; 225M USDG token-bucket capacity, 2,604/sec refill — 225M burst,
      ~450M max per 24h (capacity raised from 45M between Mar and Sep 2026);
      allowAnyMintAndBurnAddress = true. owner() and LayerZero delegate are
      the Operations MPC wallet, with no timelock.
  - id: sc4
    label: Supply Controller 4 (10 USDG cap)
    address: "0x835e20DA02D830d6074Ca2341e2928f438121691"
    category: infra
    note: >-
      EOA, added Sep 18 2026 directly by the MPC wallet; 10 USDG cap
      refilling over 1h, whitelisted to the issuance treasury only. Unused
      (nonce 0).
  - id: sc5-bridge
    label: SC5 Attestor Bridge (100M burst)
    address: "0x40D16A860e295fb4E096Cdb5e99C32721194add4"
    category: infra
    note: >-
      ERC1967 proxy, added Oct 2 2026 directly by the MPC wallet. Implementation
      0xb9de…362f is NOT source-verified. 100M USDG burst, ~200M max per 24h,
      allowAnyMintAndBurnAddress = true. One ATTESTOR and one WITNESS EOA.
      Registers USDG, PYUSD, PAXG to an undisclosed chain (id 7). Unused so far.
  - id: facets
    label: Token Facets (5 contracts, 118 selectors)
    address: "0x77fe0365db15a1ec05833b7c1802d68356a363df"
    category: infra
    note: >-
      PayoutGroup / MultiplierMgmt / TokenExtensions / TokenAdmin /
      ClaimableRewards. Live since Feb 28 2026; routed via setFacet under
      DEFAULT_ADMIN (24h timelock). Address shown is PayoutGroupFacet.
  - id: rewards-eoas
    label: Rewards Hot Wallets (3 EOAs)
    address: "0x55f78e37adb9d1f6931c1da7314b374558ae9684"
    category: governance
    note: >-
      MULT_RATE, PAYOUT_GROUP_REGISTRAR, CLAIM_OPERATOR. Single keys, no
      timelock. Cannot mint or seize principal. Address shown is the
      registrar; others are 0x4e43…eef8 and 0x5fd9…2e38.

  # === Governance ===
  - id: token-timelock
    label: Token Admin Timelock (24h)
    address: "0x9036566eAa5F83E0b9E1161C6c602b0Adf997654"
    category: governance
    note: >-
      OpenZeppelin TimelockController; also DEFAULT_ADMIN on SupplyControl
      (upgrades/admin transfer only; mint parameters sit with the SCM).
      Four role grants ever (Jan 22 2026), zero revocations. The MPC wallet
      is the sole proposer, executor AND canceller — the delay is a
      monitoring/exit window, not a circuit breaker.
  - id: sc5-timelock
    label: SC5 Bridge Admin Timelock (24h)
    address: "0xDd05D7769C622Ab60Aed26318B2a5b0308b77683"
    category: governance
    note: >-
      OpenZeppelin TimelockController deployed Sep 30 2026. DEFAULT_ADMIN,
      BRIDGE_MANAGER, RATE_LIMITER, FEE_WITHDRAWER on SC5. MPC wallet is
      sole proposer, executor and canceller.
  - id: default-admin-multisig
    label: DEFAULT_ADMIN Multisig (20 owners, thresh 3)
    address: "0x137Dcd97872dE27a4d3bf36A4643c5e18FA40713"
    category: governance
    note: SimpleMultiSig; NO current governance roles (was proposer/executor)
  - id: ops-multisig
    label: Operational Multisig (20 owners, thresh 3)
    address: "0x0644Bd0248d5F89e4F6E845a91D15c23591e5D33"
    category: governance
    note: SimpleMultiSig; NO current governance roles
  - id: ops-mpc
    label: Operations MPC Wallet (Fordefi)
    address: "0x3Af3e85f4f97De7AD0f000B724Fb77fE5ffc024B"
    category: governance
    note: >-
      MPC wallet (key sharded); PAUSE + ASSET_PROTECTION on token;
      PROPOSER+EXECUTOR+CANCELLER on both timelocks; SUPPLY_CONTROLLER_MANAGER
      on SupplyControl (add controllers, limits, whitelists — no timelock);
      PAUSE on SC5.
  - id: gas-station
    label: Issuance Treasury / MPC Gas Station
    address: "0x264bd8291fae1d75db2c5f573b07faa6715997b5"
    category: infra
    note: >-
      SC1's and SC4's only permitted mint destination (11.5M USDG held). Also
      the MPC gas funder — nonce 6.26M+, just-in-time ETH, services 62+ EOAs.

  # === External dependencies ===
  - id: dep-paxos-custody
    label: Paxos Reserves (Offchain)
    category: dependency
    note: T-Bills + cash at segregated custodians; MAS-supervised
  - id: dep-layerzero
    label: LayerZero V2 OFT
    category: dependency
    note: >-
      OFTWrapper peers (onchain) — Solana / X Layer / Ink / Arbitrum /
      Robinhood Chain / Mantle; 3-of-3 DVN quorum (LayerZero Labs, Canary, Paxos —
      only two independent of the issuer). Quorum is mutable by the wrapper
      owner with no timelock.

edges:
  # === Governance flow ===
  - from: ops-mpc
    to: token-timelock
    kind: holds-role
    label: PROPOSER + EXECUTOR + CANCELLER (sole holder — no independent canceller)
  - from: token-timelock
    to: usdg
    kind: controls
    label: DEFAULT_ADMIN + owner (24h delay)
  - from: ops-mpc
    to: usdg
    kind: holds-role
    label: PAUSE + ASSET_PROTECTION (no onchain timelock)
  - from: token-timelock
    to: supply-control
    kind: controls
    label: DEFAULT_ADMIN (24h delay)
  - from: ops-mpc
    to: supply-control
    kind: holds-role
    label: SUPPLY_CONTROLLER_MANAGER (add controllers, limits, whitelists — NO timelock)
  - from: ops-mpc
    to: sc5-timelock
    kind: holds-role
    label: PROPOSER + EXECUTOR + CANCELLER (sole holder)
  - from: sc5-timelock
    to: sc5-bridge
    kind: controls
    label: DEFAULT_ADMIN + BRIDGE_MANAGER + RATE_LIMITER (24h delay)
  - from: ops-mpc
    to: sc5-bridge
    kind: holds-role
    label: PAUSE (no timelock)
  - from: gas-station
    to: ops-mpc
    kind: routes-through
    label: funds MPC wallet (just-in-time gas)
  - from: ops-mpc
    to: oft-wrapper
    kind: controls
    label: owner + LZ delegate (NO timelock)
  - from: token-timelock
    to: facets
    kind: controls
    label: setFacet via DEFAULT_ADMIN (24h delay)
  - from: facets
    to: usdg
    kind: routes-through
    label: 118 selectors (rewards + admin + permits)
  - from: ops-mpc
    to: usdg
    kind: holds-role
    label: MULT_ADMIN + PAYOUT_GROUP_ADMIN + CLAIM_ADMIN (rewards)
  - from: rewards-eoas
    to: usdg
    kind: holds-role
    label: MULT_RATE + REGISTRAR + CLAIM_OPERATOR (EOAs, no timelock)

  # === Mint authority on USDG ===
  - from: sc1
    to: usdg
    kind: mints
    label: SUPPLY_CONTROLLER (500M/hr, whitelisted dest)
  - from: sc2
    to: usdg
    kind: mints
    label: SUPPLY_CONTROLLER (1B burst; self-whitelisted, transferable)
  - from: oft-wrapper
    to: usdg
    kind: mints
    label: SUPPLY_CONTROLLER (225M burst, ~450M/24h; bridge; any dest)
  - from: sc4
    to: usdg
    kind: mints
    label: SUPPLY_CONTROLLER (10 USDG/hr, whitelisted dest)
  - from: sc5-bridge
    to: usdg
    kind: mints
    label: SUPPLY_CONTROLLER (100M burst, ~200M/24h; attestor bridge; any dest; unverified source)

  # === Supply controller registry ===
  - from: supply-control
    to: sc1
    kind: manages
    label: rate-limited
  - from: supply-control
    to: sc2
    kind: manages
    label: rate-limited
  - from: supply-control
    to: oft-wrapper
    kind: manages
    label: rate-limited
  - from: supply-control
    to: sc4
    kind: manages
    label: rate-limited
  - from: supply-control
    to: sc5-bridge
    kind: manages
    label: rate-limited

  # === External dependencies (off-chain backing + bridge) ===
  - from: usdg
    to: dep-paxos-custody
    kind: deposits-into
    label: "1:1 fiat reserves (offchain)"
  - from: oft-wrapper
    to: dep-layerzero
    kind: routes-through
    label: cross-chain transfer
