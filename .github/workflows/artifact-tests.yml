name: Artifact uploader tests

on:
  pull_request:
    paths:
      - '.github/workflows/artifact-tests.yml'
      - 'scripts/post_artifact.py'
      - 'scripts/env.py'
      - 'tests/test_post_artifact.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'

      - name: Test artifact publishing against a local HTTP server
        run: uv run --locked python -m unittest tests.test_post_artifact
