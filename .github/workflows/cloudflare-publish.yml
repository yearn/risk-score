name: Protected Cloudflare publication

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      pr:
        type: string
        default: ''
      sha:
        type: string
        required: true
      checksum:
        type: string
        required: true
      artifact:
        type: string
        required: true
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_PREVIEW_API_TOKEN:
        required: false
      CLOUDFLARE_PRODUCTION_API_TOKEN:
        required: false
      MONITORING_PREVIEW_API_TOKEN:
        required: false
      MONITORING_PRODUCTION_API_TOKEN:
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  deployments: write

jobs:
  publish:
    if: >-
      (inputs.mode == 'preview' && github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository && inputs.pr != '') ||
      (inputs.mode == 'production' && github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.pr == '')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-publish-${{ inputs.mode }}-${{ inputs.pr || 'master' }}
      cancel-in-progress: false
    # Owners configure required reviewers and prevent-self-review before enabling.
    environment: cloudflare-${{ inputs.mode }}
    steps:
      - name: Check out reviewed deployment tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install reviewed deployment dependencies
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.artifact }}
          path: incoming
      - name: Validate release identity and upload preview
        if: inputs.mode == 'preview'
        run: node scripts/deploy_cloudflare.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          SOURCE_REVISION: ${{ inputs.sha }}
          BUNDLE_CHECKSUM: ${{ inputs.checksum }}
          ARTIFACT_ID: ${{ inputs.artifact }}
          BUNDLE_PATH: incoming/bundle.json
          DEPLOY_RECORD_PATH: deployment.json
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          MONITORING_API_URL: ${{ vars.MONITORING_API_URL }}
          MONITORING_API_TOKEN: ${{ secrets.MONITORING_PREVIEW_API_TOKEN }}
      - name: Validate release identity and publish production
        if: inputs.mode == 'production'
        run: node scripts/deploy_cloudflare.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          SOURCE_REVISION: ${{ inputs.sha }}
          BUNDLE_CHECKSUM: ${{ inputs.checksum }}
          ARTIFACT_ID: ${{ inputs.artifact }}
          BUNDLE_PATH: incoming/bundle.json
          DEPLOY_RECORD_PATH: deployment.json
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          MONITORING_API_URL: ${{ vars.MONITORING_API_URL }}
          MONITORING_API_TOKEN: ${{ secrets.MONITORING_PRODUCTION_API_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.mode }}-record-${{ inputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment.json
          retention-days: 90
